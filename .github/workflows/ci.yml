name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter './packages/*' build
      - run: pnpm --filter @pathcompiler/next-demo exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            fixtures/next-demo/test-results/
            packages/workflow-validator/test-results/
            packages/runtime-core/test-results/
            apps/dashboard/test-results/
            examples/reference-demo/test-results/
          if-no-files-found: ignore
